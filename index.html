<style>
/* Black and gold, the Helen Transport Services brand. Phone-first: sticky header, bottom tabs, bottom sheets. */
:root{
  --bg:#0b0b0d; --panel:#16161a; --panel2:#1d1d22; --line:#2c2c33; --ink:#f3efe6; --muted:#a9a397;
  --gold:#d4a537; --gold2:#f0cf7a; --gold-ink:#1a1305;
  --good:#4cc283; --warn:#e8a04c; --bad:#ef6b61; --info:#6aa8ff;
  --good-bg:#14301f; --warn-bg:#3a2a12; --bad-bg:#3d1b18; --idle-bg:#24242a; --info-bg:#162638;
  --serif:"Cinzel",Georgia,serif; --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.96);backdrop-filter:blur(8px);border-bottom:1px solid #3a2f14}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--gold);color:var(--gold);font:700 20px var(--serif);background:#000;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand{min-width:0;flex:1}
.brand b{display:block;font:700 18px var(--serif);letter-spacing:.06em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px}
main{padding-block:16px 110px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
h1,h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.05}
h1{font-size:28px} h2{font-size:22px}
h3{font-family:var(--cond);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:8px 0 0}
.muted,.note{color:var(--muted);font-size:14px}
.note{margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.tap{cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.sev{border-left:5px solid var(--line)}
.sev.bad{border-left-color:var(--bad)} .sev.warn{border-left-color:var(--warn)} .sev.good{border-left-color:var(--good)} .sev.gold{border-left-color:var(--gold)}
.top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.route{font-weight:700;overflow-wrap:anywhere}
.money{font-family:var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 1 auto;max-width:50%}
.money .muted{white-space:normal;font-size:12px}
.top2>div:first-child{flex:1 1 auto}
.pill{display:inline-block;font:700 12px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--idle-bg);color:var(--muted)}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-gold{background:#2e2410;color:var(--gold2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:700;padding:11px 16px;cursor:pointer;text-decoration:none;font-size:15px}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);border-color:var(--gold)}
.btn.bad{color:var(--bad);border-color:#5a2a26}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:#0f0f12;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-size:16px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
label.chk{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font:500 19px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hero{background:radial-gradient(120% 140% at 0% 0%,#2a210c 0%,#121214 60%);border:1px solid #3a2f14;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .big{font:500 34px var(--mono);color:var(--gold2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,15,18,.97);border-top:1px solid #3a2f14;display:grid;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 12px var(--body);padding:10px 1px 12px;cursor:pointer;border-top:3px solid transparent;position:relative;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){nav.tabs button{font-size:11px}}
nav.tabs button[aria-selected="true"]{color:var(--gold2);border-top-color:var(--gold)}
nav.tabs .dot{position:absolute;top:4px;left:calc(50% + 10px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:17px;padding:0 4px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);border-top:1px solid #3a2f14;width:100%;max-width:860px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:var(--gold);color:var(--gold-ink);font-weight:700;padding:11px 16px;border-radius:12px;z-index:90;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.err{background:var(--bad);color:#fff}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:200px}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#0f0f12;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;min-width:0}
.file span,.file a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth .box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.auth .seal{width:96px;height:96px;margin:0 auto;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;font:700 46px var(--serif);color:var(--gold);background:#000;box-shadow:0 0 40px rgba(212,165,55,.25)}
.auth h1{text-align:center;font-family:var(--serif);font-size:24px;letter-spacing:.08em}
.auth .tag{text-align:center;color:var(--gold);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.err{color:var(--bad);font-size:14px}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:#0f0f12;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.calc .m{font-family:var(--mono);text-align:right}
.ok{color:var(--good)} .low{color:var(--warn)}
#print{display:none}
@media (max-width:460px){.g3{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.hero .big{font-size:28px}}
@media (max-width:380px){.g2{grid-template-columns:1fr}}
@media print{
  body{background:#fff;color:#000;padding:0}
  body > *:not(#print){display:none!important}
  #print{display:block!important;color:#000;font-family:Arial,sans-serif;font-size:12px}
  #print h1{font-size:20px;margin:0} #print table{width:100%;border-collapse:collapse;margin-top:10px}
  #print th,#print td{border-bottom:1px solid #ccc;padding:5px;text-align:left} #print .r{text-align:right}
  #print .head{display:flex;gap:14px;align-items:center;border-bottom:3px solid #b8892a;padding-bottom:10px;margin-bottom:10px}
  #print .head img{width:64px;height:64px;object-fit:contain}
}

    if (!R.some(r => r.kind === 'rotulacao')) out.push({ k: 'marking', s: 'miss', txt: 'Falta foto da rotulação USDOT' });
    else out.push({ k: 'marking', s: 'ok', txt: 'Rotulação USDOT com foto' });

  };

  H.loadScript = src => new Promise((ok, no) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Sem internet para carregar o leitor.')); document.head.appendChild(s) });
  /* lê o texto de um print (roda no próprio celular) */

    await H.loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const r = await window.Tesseract.recognize(file, 'eng', { logger: m => { if (onProgress && m.status === 'recognizing text') onProgress(Math.round(m.progress * 100)) } });
    return (r && r.data && r.data.text) || '';
  };

  /* ---------------- ler o recibo / a bomba de combustível ---------------- */
  H.parseFuel = raw => {
    const txt = String(raw || '').replace(/\r/g, '').replace(/[|]/g, ' '), out = {}, found = [];
    const n = s => +String(s).replace(/[$,\s]/g, '').replace(/[oO]/g, '0');
    const pick = (res) => { for (const re of res) { const m = re.exec(txt); if (m) return m } return null };
    const tot = pick([/(?:total\s*(?:sale|due|amount)?|fuel\s*sale|sale|amount|purchase|total\s*\$|balance|charged?)\s*[:=]?\s*\$?\s*(\d{1,4}[.,]\d{2})/i, /\$\s*(\d{1,4}\.\d{2})\s*$/m]);
    if (tot) { out.total = n(tot[1].replace(',', '.')); found.push('total') }
    const gal = pick([/(?:gallons?|gals?|volume|qty|quantity|gal\.?)\s*[:=]?\s*(\d{1,3}[.,]\d{1,3})/i, /(\d{1,3}[.,]\d{1,3})\s*(?:gallons?|gals?|g)\b/i]);
    if (gal) { out.gallons = n(gal[1].replace(',', '.')); found.push('galões') }
    const ppg = pick([/(?:price\s*\/?\s*gal(?:lon)?|\$\s*\/\s*gal|ppg|unit\s*price|price\s*per\s*gal(?:lon)?|@)\s*[:=]?\s*\$?\s*(\d\.\d{2,3})/i, /(\d\.\d{3})\s*(?:\/\s*gal|per\s*gal)/i, /\$?\s*(\d\.\d{2}9)\b/]);
    if (ppg) { out.ppg = n(ppg[1]); found.push('preço/galão') }
    if (!out.total && out.gallons && out.ppg) { out.total = Math.round(out.gallons * out.ppg * 100) / 100; found.push('total') }
    if (!out.gallons && out.total && out.ppg) { out.gallons = Math.round(out.total / out.ppg * 1000) / 1000; found.push('galões') }
    if (!out.ppg && out.total && out.gallons) out.ppg = Math.round(out.total / out.gallons * 1000) / 1000;
    const odo = /(?:odometer|odo|mileage|hubometer)\s*[:=#]?\s*(\d{3,7})/i.exec(txt); if (odo) { out.odometer = n(odo[1]); found.push('odômetro') }
    const d = /\b(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})\b/.exec(txt);
    if (d) { let y = +d[3]; if (y < 100) y += 2000; const mo = +d[1], dd = +d[2]; if (mo >= 1 && mo <= 12 && dd >= 1 && dd <= 31) { out.fuel_date = `${y}-${String(mo).padStart(2, '0')}-${String(dd).padStart(2, '0')}`; found.push('data') } }

    const city = /([A-Za-z][A-Za-z .'-]{2,30}),?\s+(AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|IA|ID|IL|IN|KS|KY|LA|MA|MD|ME|MI|MN|MO|MS|MT|NC|ND|NE|NH|NJ|NM|NV|NY|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VA|VT|WA|WI|WV|WY)\s*\d{5}/.exec(txt);
    const st = [brand ? brand[1].replace(/\b[a-z]/g, c => c.toUpperCase()) : '', city ? city[1].trim().split(/\s{2,}/).pop().replace(/\b[a-z]/gi, c => c.toUpperCase()) + ', ' + city[2] : ''].filter(Boolean).join(' · ');
    if (st) { out.station = st; found.push('posto') }
    return { data: out, found };
  };

  H.camBtns = (lang, attrs = '', o = {}) => { const L = H.camLabels(lang);
    return `<div class="row cam2"><span class="btn upl ${o.gold ? 'gold' : ''} ${o.sm ? 'sm' : ''}">${L[0]}<input type="file" accept="image/*" capture="environment" ${attrs}></span><span class="btn upl ${o.sm ? 'sm' : ''}">${L[1]}<input type="file" accept="${o.accept || 'image/*,application/pdf'}" ${o.multiple ? 'multiple' : ''} ${attrs}></span></div>` };

  /* ---------------- login ---------------- */
  function setupScreen() {

    $('#setup').onsubmit = e => { e.preventDefault(); const o = H.form(e.target); try { localStorage.setItem('hts-config', JSON.stringify({ url: o.url, key: o.key })) } catch (x) { } location.reload() };
  }

  H.wireLang = (el, cb) => $$('[data-lang]', el).forEach(b => b.onclick = () => { H.setLang(b.dataset.lang); cb && cb(b.dataset.lang) });
  const AT = {
    pt: { login: 'Entrar', signup: 'Criar conta', reset: 'Esqueci a senha', resetGo: 'Enviar link', newpass: 'Nova senha', savePass: 'Salvar senha', email: 'E-mail', pass: 'Senha', signupNote: 'Use o mesmo e-mail que a Helen cadastrou para você. Mínimo 8 caracteres.', confirmT: 'Confirme o e-mail', confirm: 'Enviamos um link para {e}. Abra o e-mail, toque no link e depois volte aqui para entrar. Veja também a pasta de spam.', resetSent: 'Se o e-mail tiver conta, chegou um link para criar uma nova senha.', saved: 'Senha salva' },

      e.preventDefault(); const o = H.form(e.target), er = $('#aerr'); er.hidden = true;

  function sidesHtml() {
    return `<span class="muted">${esc(t().sidesHelp)}</span>${H.vanDiagram(t().diag)}<div class="g2">${SIDE_KEYS.map((k, i) => { const x = H.vpRow(S.docs, k), m = i >= 6, val = x && x.note && x.note.includes(' = ') ? x.note.split(' = ')[1] : '';
      return `<div class="card ${x ? 'sev good' : ''}" style="padding:10px"><b>${x ? '✅' : '⬜'} ${esc(t().sides[i])}${val ? ' · ' + esc(val) : ''}</b>${m ? `<label class="f">${esc(t().inches)}<input type="number" inputmode="decimal" step="0.5" data-meas="${i}" value="${esc(String(val).replace(/[^\d.]/g, ''))}"></label>` : ''}${H.camBtns(lang(), `data-side="${i}"`, { sm: true, accept: 'image/*' })}</div>` }).join('')}</div>`;
  }
  /* ---------------- combustível ---------------- */
  VIEWS.combustivel = {
    html: () => `<div class="stack"><button class="btn gold wide" id="fAdd">${esc(t().fuelAdd)}</button>
      ${S.fuel.length ? S.fuel.map(x => `<div class="card"><div class="top2"><div><b>${brDate(x.fuel_date)}</b><div class="muted">${esc(x.station || '')}${x.gallons ? ' · ' + num(x.gallons).toFixed(1) + ' gal' : ''}${x.odometer ? ' · ' + fmtI(x.odometer) : ''}</div></div><div class="money">${fmt(x.total)}<div class="muted">${x.payer === 'cartao' ? esc(t().card) + (x.settled ? ' ✓' : '') : esc(t().mine)}</div></div></div></div>`).join('') : ''}</div>`,
    wire(v) { $('#fAdd', v).onclick = fuelSheet }
  };
  function fuelSheet() {
    const photos = [];
    H.sheet(`<form id="fs" class="stack"><div class="row between"><h2>${esc(t().fuel)}</h2><button type="button" class="btn sm" data-close>✕</button></div><p class="note">${esc(t().fuelHelp)}</p>
      <div class="thumbs" id="fsT"></div>${H.camBtns(lang(), 'data-fs', { gold: true, accept: 'image/*', multiple: true })}<p class="note" id="fsRead" role="status"></p>
      <div class="g2"><label class="f">${esc(t().date)}<input type="date" name="fuel_date" value="${iso(today())}" required></label><label class="f">${esc(t().total)}<input type="number" inputmode="decimal" step="0.01" name="total" required></label>
      <label class="f">${esc(t().gallons)}<input type="number" inputmode="decimal" step="0.001" name="gallons"></label><label class="f">${esc(t().ppg)}<input type="number" inputmode="decimal" step="0.001" name="ppg"></label>
      <label class="f">${esc(t().odometer)}<input type="number" inputmode="numeric" name="odometer"></label>
      <label class="f full">${esc(t().station)}<input name="station"></label><label class="f full">${esc(t().payer)}<select name="payer"><option value="cartao">${esc(t().card)}</option><option value="motorista">${esc(t().mine)}</option></select></label></div>
      <button class="btn gold wide" id="fsGo">${esc(t().save)}</button></form>`, api => {
      const f = $('#fs', api.el);
      let read = false;
      const fillFrom = async file => { const msg = $('#fsRead', f);
        try { msg.textContent = t().reading; const txt = await H.ocr(file, p => { msg.textContent = t().reading + ' ' + p + '%' }); const r = H.parseFuel(txt);
          const done = []; Object.entries(r.data).forEach(([k, v]) => { const i = $(`[name="${k}"]`, f); if (i && v != null && v !== '' && (!i.value || (k === 'fuel_date' && !read))) { i.value = v; done.push(k) } });
          const FL = { es: { 'galões': 'galones', 'preço/galão': 'precio/galón', 'odômetro': 'odómetro', data: 'fecha', posto: 'estación' }, en: { 'galões': 'gallons', 'preço/galão': 'price/gal', 'odômetro': 'odometer', data: 'date', posto: 'station' } }[lang()] || {};
          msg.textContent = r.found.length ? t().readOk + r.found.map(k => FL[k] || k).join(', ') : t().readNo; if (r.found.length) read = true } catch (x) { msg.textContent = t().readNo } };
      $$('input[data-fs]', f).forEach(inp => inp.onchange = async e => { const files = [...e.target.files]; e.target.value = ''; for (const file of files) { try { H.toast('…'); photos.push((await H.upload('files', `${S.me.id}/fuel`, file)).path); await H.thumbs($('#fsT', f), photos) } catch (x) { H.fail(x) } }
        if (files[0] && !read) for (const file of files) { await fillFrom(file); if (read) break } });
      f.onsubmit = async e => { e.preventDefault(); const o = H.form(f); if (!photos.length) { H.toast(t().needPhoto, true); return }
        await H.busy($('#fsGo', f), async () => { await H.q(H.sb.from('fuel').insert({ ...o, driver_id: S.me.id, photos })); api.close(); H.toast('✓'); await R.reload() }) };
    });
  }
})(window.HTS);

</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(r => r.forEach(x => x.unregister())).catch(()=>{});
  HTS.boot();
</script>
</body>
</html>
