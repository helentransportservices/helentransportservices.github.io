<style>
/* Black and gold, the Helen Transport Services brand. Phone-first: sticky header, bottom tabs, bottom sheets. */
:root{
  --bg:#0b0b0d; --panel:#16161a; --panel2:#1d1d22; --line:#2c2c33; --ink:#f3efe6; --muted:#a9a397;
  --gold:#d4a537; --gold2:#f0cf7a; --gold-ink:#1a1305;
  --good:#4cc283; --warn:#e8a04c; --bad:#ef6b61; --info:#6aa8ff;
  --good-bg:#14301f; --warn-bg:#3a2a12; --bad-bg:#3d1b18; --idle-bg:#24242a; --info-bg:#162638;
  --serif:"Cinzel",Georgia,serif; --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.96);backdrop-filter:blur(8px);border-bottom:1px solid #3a2f14}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--gold);color:var(--gold);font:700 20px var(--serif);background:#000;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand{min-width:0;flex:1}
.brand b{display:block;font:700 18px var(--serif);letter-spacing:.06em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px}
main{padding-block:16px 110px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
h1,h2{font-family:var(--cond);text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.05}
h1{font-size:28px} h2{font-size:22px}
h3{font-family:var(--cond);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:8px 0 0}
.muted,.note{color:var(--muted);font-size:14px}
.note{margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.tap{cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.sev{border-left:5px solid var(--line)}
.sev.bad{border-left-color:var(--bad)} .sev.warn{border-left-color:var(--warn)} .sev.good{border-left-color:var(--good)} .sev.gold{border-left-color:var(--gold)}
.top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.route{font-weight:700;overflow-wrap:anywhere}
.money{font-family:var(--mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 1 auto;max-width:50%}
.money .muted{white-space:normal;font-size:12px}
.top2>div:first-child{flex:1 1 auto}
.pill{display:inline-block;font:700 12px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--idle-bg);color:var(--muted)}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-gold{background:#2e2410;color:var(--gold2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:700;padding:11px 16px;cursor:pointer;text-decoration:none;font-size:15px}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);border-color:var(--gold)}
.btn.bad{color:var(--bad);border-color:#5a2a26}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:#0f0f12;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-size:16px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
label.chk{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.full{grid-column:1/-1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font:500 19px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hero{background:radial-gradient(120% 140% at 0% 0%,#2a210c 0%,#121214 60%);border:1px solid #3a2f14;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .big{font:500 34px var(--mono);color:var(--gold2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,15,18,.97);border-top:1px solid #3a2f14;display:grid;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 12px var(--body);padding:10px 2px 12px;cursor:pointer;border-top:3px solid transparent;position:relative}
nav.tabs button[aria-selected="true"]{color:var(--gold2);border-top-color:var(--gold)}
nav.tabs .dot{position:absolute;top:4px;left:calc(50% + 10px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:17px;padding:0 4px}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);border-top:1px solid #3a2f14;width:100%;max-width:860px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:var(--gold);color:var(--gold-ink);font-weight:700;padding:11px 16px;border-radius:12px;z-index:90;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.err{background:var(--bad);color:#fff}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:200px}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#0f0f12;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;min-width:0}
.file span,.file a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth .box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.auth .seal{width:96px;height:96px;margin:0 auto;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;font:700 46px var(--serif);color:var(--gold);background:#000;box-shadow:0 0 40px rgba(212,165,55,.25)}
.auth h1{text-align:center;font-family:var(--serif);font-size:24px;letter-spacing:.08em}
.auth .tag{text-align:center;color:var(--gold);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.err{color:var(--bad);font-size:14px}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:#0f0f12;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.calc .m{font-family:var(--mono);text-align:right}
.ok{color:var(--good)} .low{color:var(--warn)}
#print{display:none}
@media (max-width:460px){.g3{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.hero .big{font-size:28px}}
@media (max-width:380px){.g2{grid-template-columns:1fr}}
@media print{
  body{background:#fff;color:#000;padding:0}
  body > *:not(#print){display:none!important}
  #print{display:block!important;color:#000;font-family:Arial,sans-serif;font-size:12px}
  #print h1{font-size:20px;margin:0} #print table{width:100%;border-collapse:collapse;margin-top:10px}
  #print th,#print td{border-bottom:1px solid #ccc;padding:5px;text-align:left} #print .r{text-align:right}
  #print .head{display:flex;gap:14px;align-items:center;border-bottom:3px solid #b8892a;padding-bottom:10px;margin-bottom:10px}
  #print .head img{width:64px;height:64px;object-fit:contain}
}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

  const ORDER = { companies: 'name', drivers: 'name', docs: 'created_at', loads: 'load_date', events: 'created_at', fuel: 'fuel_date', settlements: 'created_at', quickpay: 'requested_at', ledger: 'entry_date', apps: 'created_at' };
  const st = { route: 'painel', sub: 'empresas', period: 'month', company: 'all', driver: 'all', stage: 'ativas', search: '' };

  async function load(keys) {
    keys = keys || Object.keys(TABLES);
    await Promise.all(keys.map(async k => {
      D[k] = await H.q(H.sb.from(TABLES[k]).select('*').order(ORDER[k], { ascending: !['created_at', 'load_date', 'fuel_date', 'requested_at', 'entry_date'].includes(ORDER[k]) }).limit(5000));
    }));
  }
  A.reload = async keys => { try { await load(keys); render() } catch (e) { H.fail(e) } };

  const drv = id => D.drivers.find(d => d.id === id) || {};
  const comp = id => D.companies.find(c => c.id === id) || {};
  const carriers = () => D.companies.filter(c => c.type === 'carrier');
  const dispatchCo = () => D.companies.find(c => c.type === 'dispatch');
  const loadCo = l => l.company_id || drv(l.driver_id).company_id;
  const brandOf = d => d.brand || d.name || 'Motorista';
  const opt = (list, val, blank) => (blank ? `<option value="">${esc(blank)}</option>` : '') + list.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(val ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const STAGE = { oferta: ['Oferta', 'p-gold'], confirmada: ['Confirmada', 'p-info'], coletada: ['Coletada', 'p-info'], entregue: ['Entregue', 'p-good'], cancelada: ['Cancelada', ''] };
  const RESP = { aceita: ['Motorista aceitou', 'p-good'], recusada: ['Motorista recusou', 'p-bad'], contraproposta: ['Contraproposta', 'p-warn'] };

  function period() {
    const t = today(); let f = null, to = null;
    if (st.period === 'week') { f = new Date(t); f.setDate(f.getDate() - ((f.getDay() + 6) % 7)) }
    else if (st.period === 'month') f = new Date(t.getFullYear(), t.getMonth(), 1);
    else if (st.period === 'last') { f = new Date(t.getFullYear(), t.getMonth() - 1, 1); to = new Date(t.getFullYear(), t.getMonth(), 0) }
    return { from: f ? iso(f) : '', to: to ? iso(to) : '' };
  }
  const inPeriod = d => { const p = period(); return (!p.from || d >= p.from) && (!p.to || d <= p.to) };

  /* ================= estrutura ================= */
  const TABS = [['painel', 'Painel'], ['cargas', 'Cargas'], ['motoristas', 'Motoristas'], ['acertos', 'Acertos'], ['mais', 'Mais']];
  A.start = async () => {
    $('#app').innerHTML = `<header class="top"><div class="wrap"><div class="logo">H</div><div class="brand"><b>Helen Transport</b><span>Painel · ${esc(H.cfg.dispatchName)}</span></div>
      <button class="iconbtn" id="reload" aria-label="Atualizar">↻</button><button class="iconbtn" id="out">Sair</button></div></header>
      <main class="wrap" id="view"><div class="empty">Carregando…</div></main>
      <nav class="tabs" style="grid-template-columns:repeat(${TABS.length},1fr)" role="tablist">${TABS.map(([k, l]) => `<button role="tab" data-t="${k}">${l}<span class="dot" hidden></span></button>`).join('')}</nav>`;
    $('#out').onclick = H.signOut; $('#reload').onclick = () => A.reload();
    $$('nav.tabs button').forEach(b => b.onclick = () => { location.hash = b.dataset.t });
    window.onhashchange = () => { readHash(); render(); window.scrollTo(0, 0) };
    readHash();
    try { await load() } catch (e) { H.fail(e) }
    render();
  };
  function readHash() { const [r, s] = location.hash.replace('#', '').split('/'); st.route = TABS.some(t => t[0] === r) ? r : 'painel'; if (s) st.sub = s }

  function render() {
    $$('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === st.route));
    const pend = pendings();
    const dot = $('nav.tabs button[data-t="painel"] .dot'); if (dot) { dot.hidden = !pend.length; dot.textContent = pend.length }
    const v = $('#view'); if (!v) return;
    const fn = { painel: vPainel, cargas: vCargas, motoristas: vMotoristas, acertos: vAcertos, mais: vMais }[st.route];
    v.innerHTML = fn.html(); fn.wire && fn.wire(v);
  }

  /* ================= pendências ================= */
  function pendings() {
    const out = [];
    D.loads.filter(l => l.stage === 'oferta' && l.offer_response).forEach(l => out.push({ s: l.offer_response === 'recusada' ? 'bad' : 'gold', t: `${drv(l.driver_id).name || '—'}: ${RESP[l.offer_response][0].toLowerCase()}${l.offer_response === 'contraproposta' ? ' ' + fmt(l.counter_amount) : ''}`, d: `${l.origin} → ${l.destination}`, go: 'cargas' }));
    D.docs.filter(x => x.status === 'enviado').forEach(x => { const it = H.DOCS.find(i => i.k === x.item) || { t: x.item }; out.push({ s: 'info', t: `${drv(x.driver_id).name || '—'} enviou documento`, d: it.t, go: 'motoristas/' + x.driver_id }) });
    D.quickpay.filter(q => q.status === 'pendente').forEach(q => out.push({ s: 'gold', t: `Quick Pay de ${drv(q.driver_id).name || '—'}`, d: fmt(q.amount) + ' · taxa ' + fmt(q.fee), go: 'acertos' }));
    D.quickpay.filter(q => q.status === 'aprovado' && q.eligible_on && q.eligible_on <= iso(today())).forEach(q => out.push({ s: 'warn', t: `Pagar Quick Pay de ${drv(q.driver_id).name || '—'}`, d: 'Liberado desde ' + brDate(q.eligible_on), go: 'acertos' }));
    D.drivers.filter(d => d.status !== 'inativo').forEach(d => H.DOCS.forEach(it => { if (!H.docApplies(d, it)) return; const s = H.docStatus(d, it, D.docs.filter(x => x.driver_id === d.id)); if (s.s === 'bad' || s.s === 'warn') out.push({ s: s.s, t: `${d.name}: ${it.t}`, d: s.txt, go: 'motoristas/' + d.id }) }));
    D.companies.forEach(c => H.companyAlerts(c).forEach(a => { if (a.s !== 'ok') out.push({ s: a.s === 'miss' ? 'warn' : a.s, t: `${c.name}: ${a.t}`, d: a.txt, go: 'mais/empresas' }) }));
    return out;
  }

  /* ================= PAINEL ================= */
  const vPainel = {
    html() {
      const L = D.loads.filter(l => l.stage !== 'cancelada' && l.stage !== 'oferta' && inPeriod(l.load_date) && (st.company === 'all' || loadCo(l) === st.company));
      let rev = 0, pay = 0, mi = 0, dh = 0; L.forEach(l => { rev += num(l.rate); pay += num(l.driver_pay); mi += num(l.miles); dh += num(l.deadhead) });
      const disp = rev - pay, P = pendings();
      const byDrv = {}; L.forEach(l => { const k = l.driver_id || '-'; const g = byDrv[k] = byDrv[k] || { n: 0, rev: 0, mi: 0, disp: 0 }; g.n++; g.rev += num(l.rate); g.mi += num(l.miles); g.disp += num(l.rate) - num(l.driver_pay) });
      return `<div class="stack">${filters(true)}
        <div class="hero"><span class="muted">Faturamento das cargas</span><div class="big">${fmt(rev)}</div>
          <div class="g2"><div><span class="muted">Sua parte (dispatch)</span><div class="money" style="text-align:left;font-size:20px">${fmt(disp)}</div></div><div><span class="muted">Motoristas</span><div class="money" style="text-align:left;font-size:20px">${fmt(pay)}</div></div></div></div>
        <div class="stats"><div class="stat"><span>Cargas</span><b>${L.length}</b></div><div class="stat"><span>$/milha</span><b>${mi ? fmt(rev / mi) : '—'}</b></div><div class="stat"><span>Milhas</span><b>${fmtI(mi)}</b></div></div>
        <div class="row between"><h2>Pendências</h2><span class="muted">${P.length}</span></div>
        ${P.length ? P.slice(0, 25).map(p => `<button class="card tap sev ${p.s === 'info' ? 'gold' : p.s}" data-go="${esc(p.go)}"><b>${esc(p.t)}</b><span class="muted">${esc(p.d)}</span></button>`).join('') : '<div class="card sev good"><b>Tudo em dia.</b><span class="muted">Nenhuma resposta, documento ou pagamento esperando você.</span></div>'}
        <h2>Por motorista</h2>
        ${Object.keys(byDrv).length ? Object.entries(byDrv).map(([k, g]) => `<div class="card"><div class="top2"><div><b>${esc(drv(k).name || '—')}</b><div class="muted">${g.n} cargas · ${fmtI(g.mi)} mi${g.mi ? ' · ' + fmt(g.rev / g.mi) + '/mi' : ''}</div></div><div class="money">${fmt(g.rev)}<div class="muted">você ${fmt(g.disp)}</div></div></div></div>`).join('') : '<div class="empty">Nenhuma carga neste período.</div>'}</div>`;
    },
    wire(v) { wireFilters(v); $$('[data-go]', v).forEach(b => b.onclick = () => location.hash = b.dataset.go) }
  };
  function filters(withDriver) {
    return `<div class="stack"><div class="chips">${[['week', 'Semana'], ['month', 'Mês'], ['last', 'Mês passado'], ['all', 'Tudo']].map(([k, l]) => `<button class="chip" data-p="${k}" aria-pressed="${st.period === k}">${l}</button>`).join('')}</div>
      <div class="g2"><select id="fCo" aria-label="Empresa">${opt(carriers().map(c => [c.id, c.name]), st.company === 'all' ? '' : st.company, 'Todas as empresas')}</select>
      ${withDriver ? `<select id="fDr" aria-label="Motorista">${opt(D.drivers.map(d => [d.id, d.name]), st.driver === 'all' ? '' : st.driver, 'Todos os motoristas')}</select>` : ''}</div></div>`;
  }
  function wireFilters(v) {
    $$('[data-p]', v).forEach(b => b.onclick = () => { st.period = b.dataset.p; render() });
    const c = $('#fCo', v); if (c) c.onchange = () => { st.company = c.value || 'all'; render() };
    const d = $('#fDr', v); if (d) d.onchange = () => { st.driver = d.value || 'all'; render() };
  }

  /* ================= CARGAS ================= */
  const vCargas = {
    html() {
      const s = st.search.toLowerCase();
      const L = D.loads.filter(l => (st.stage === 'todas' || (st.stage === 'ativas' ? ['oferta', 'confirmada', 'coletada'].includes(l.stage) : l.stage === st.stage))
        && (st.company === 'all' || loadCo(l) === st.company) && (st.driver === 'all' || l.driver_id === st.driver)
        && (!s || [l.origin, l.destination, l.ref, l.broker, drv(l.driver_id).name].join(' ').toLowerCase().includes(s)));
      return `<div class="stack"><div class="row between"><h1>Cargas</h1><button class="btn gold" id="newLoad">+ Carga / oferta</button></div>
        <div class="chips">${[['ativas', 'Ativas'], ['oferta', 'Ofertas'], ['entregue', 'Entregues'], ['todas', 'Todas']].map(([k, l]) => `<button class="chip" data-s="${k}" aria-pressed="${st.stage === k}">${l}</button>`).join('')}</div>
        <input id="srch" placeholder="Buscar cidade, nº da carga, broker, motorista" value="${esc(st.search)}">
        ${filters(true).replace(/<div class="chips">[\s\S]*?<\/div>/, '')}
        ${L.length ? L.map(loadCard).join('') : '<div class="empty">Nenhuma carga aqui. Toque em <b>+ Carga / oferta</b>.</div>'}</div>`;
    },
    wire(v) {
      wireFilters(v);
      $('#newLoad', v).onclick = () => loadForm();
      $$('[data-s]', v).forEach(b => b.onclick = () => { st.stage = b.dataset.s; render() });
      const sr = $('#srch', v); sr.oninput = () => { st.search = sr.value; clearTimeout(sr._t); sr._t = setTimeout(() => { render(); const n = $('#srch'); n.focus(); n.setSelectionRange(n.value.length, n.value.length) }, 400) };
      $$('[data-load]', v).forEach(el => wireLoadCard(el));
    }
  };
  function loadCard(l) {
    const d = drv(l.driver_id), sg = STAGE[l.stage] || ['', ''], r = l.offer_response && l.stage === 'oferta' ? RESP[l.offer_response] : null;
    const ev = D.events.filter(e => e.load_id === l.id), rpm = num(l.miles) ? num(l.rate) / num(l.miles) : 0;
    return `<div class="card sev ${l.stage === 'oferta' ? 'gold' : l.stage === 'entregue' ? 'good' : ''}" data-load="${l.id}">
      <div class="top2"><div style="min-width:0"><div class="route">${esc(l.origin)} → ${esc(l.destination)}</div>
      <div class="muted">${brDate(l.load_date)} · ${esc(d.name || 'sem motorista')} · ${esc(comp(loadCo(l)).name || '')}${l.ref ? ' · #' + esc(l.ref) : ''}</div>
      <div class="muted">${fmtI(l.miles)} mi${rpm ? ' · ' + fmt(rpm) + '/mi' : ''}${l.broker ? ' · ' + esc(l.broker) : ''}</div></div>
      <div class="money">${fmt(l.rate)}<div class="muted">motorista ${fmt(l.driver_pay)}</div></div></div>
      <div class="row"><span class="pill ${sg[1]}">${sg[0]}</span>${r ? `<span class="pill ${r[1]}">${r[0]}${l.offer_response === 'contraproposta' ? ' ' + fmt(l.counter_amount) : ''}</span>` : ''}
      ${l.stage === 'oferta' && !l.offer_response ? '<span class="pill">Esperando o motorista</span>' : ''}
      ${l.paid ? `<span class="pill p-good">Pago ${brDate(l.paid_at)}${l.paid_via === 'quickpay' ? ' (Quick Pay)' : ''}</span>` : l.stage === 'entregue' ? '<span class="pill p-warn">A pagar</span>' : ''}</div>
      <div class="row">
        ${l.stage === 'oferta' ? '<button class="btn sm gold" data-a="confirm">Fechou: confirmar</button>' : ''}
        ${l.stage === 'confirmada' ? '<button class="btn sm" data-a="coletada">Marcar coletada</button>' : ''}
        ${l.stage === 'coletada' ? '<button class="btn sm" data-a="entregue">Marcar entregue</button>' : ''}
        ${ev.length ? `<button class="btn sm" data-a="events">Fotos e POD (${ev.length})</button>` : ''}
        <button class="btn sm" data-a="edit">Editar</button></div></div>`;
  }
  function wireLoadCard(el) {
    const l = D.loads.find(x => x.id === el.dataset.load), b = a => $(`[data-a="${a}"]`, el);
    const setStage = async s => { await H.q(H.sb.from('loads').update({ stage: s }).eq('id', l.id)); H.toast('Carga atualizada'); A.reload(['loads']) };
    if (b('confirm')) b('confirm').onclick = () => H.busy(b('confirm'), () => setStage('confirmada'));
    if (b('coletada')) b('coletada').onclick = () => H.busy(b('coletada'), () => setStage('coletada'));
    if (b('entregue')) b('entregue').onclick = () => H.busy(b('entregue'), () => setStage('entregue'));
    if (b('events')) b('events').onclick = () => eventsSheet(l);
    b('edit').onclick = () => loadForm(l);
  }
  function eventsSheet(l) {
    const ev = D.events.filter(e => e.load_id === l.id).sort((a, b) => a.created_at.localeCompare(b.created_at));
    H.sheet(`<div class="row between"><h2>${esc(l.origin)} → ${esc(l.destination)}</h2><button class="btn sm" data-close>Fechar</button></div>
      ${ev.map((e, i) => `<div class="card"><b>${e.kind === 'pickup' ? 'Coleta' : e.kind === 'delivery' ? 'Entrega' : 'Outro'} · ${new Date(e.created_at).toLocaleString('pt-BR')}</b>
      ${e.receiver_name ? `<span>Recebido por: <b>${esc(e.receiver_name)}</b></span>` : ''}${e.note ? `<span class="muted">${esc(e.note)}</span>` : ''}<div class="thumbs" data-ev="${i}"></div></div>`).join('')}`,
      api => ev.forEach((e, i) => H.thumbs($(`[data-ev="${i}"]`, api.el), e.photos)));
  }
  function loadForm(l) {
    const isNew = !l; l = l || { stage: 'oferta', load_date: iso(today()), dispatch_pct: null, factoring_pct: 0, broker_extra: 0 };
    const firstDrv = D.drivers.find(d => d.status !== 'inativo');
    H.sheet(`<form id="lf" class="stack"><div class="row between"><h2>${isNew ? 'Nova carga' : 'Editar carga'}</h2><button type="button" class="btn sm" data-close>Fechar</button></div>
      <p class="note">Só ofereça ao motorista depois de negociar com o broker. Não deixe valor em branco: se não souber, pergunte antes.</p>
      <div class="g2">
        <label class="f full">Etapa<select name="stage">${opt(Object.entries(STAGE).map(([k, v]) => [k, v[0] + (k === 'oferta' ? ' (aparece para o motorista aceitar)' : '')]), l.stage)}</select></label>
        <label class="f">Motorista<select name="driver_id" id="lfD" required>${opt(D.drivers.filter(d => d.status !== 'inativo' || d.id === l.driver_id).map(d => [d.id, d.name]), l.driver_id || (firstDrv || {}).id)}</select></label>
        <label class="f">Empresa (DOT)<select name="company_id" id="lfC">${opt(carriers().map(c => [c.id, c.name]), l.company_id, '— do motorista —')}</select></label>
        <label class="f">Data da coleta<input type="date" name="load_date" value="${esc(l.load_date)}" required></label>
        <label class="f">Nº da carga<input name="ref" value="${esc(l.ref)}"></label>
        <label class="f">Origem<input name="origin" value="${esc(l.origin)}" placeholder="Orlando, FL" required></label>
        <label class="f">Destino<input name="destination" value="${esc(l.destination)}" placeholder="Atlanta, GA" required></label>
        <label class="f">Janela de coleta<input name="pickup_window" value="${esc(l.pickup_window)}" placeholder="10/20 8:00–12:00"></label>
        <label class="f">Janela de entrega<input name="delivery_window" value="${esc(l.delivery_window)}"></label>
        <label class="f">Milhas carregado<input type="number" inputmode="numeric" name="miles" value="${esc(l.miles ?? '')}" required></label>
        <label class="f">Milhas vazio (deadhead)<input type="number" inputmode="numeric" name="deadhead" value="${esc(l.deadhead ?? 0)}"></label>
        <label class="f">Valor da carga $<input type="number" inputmode="decimal" step="0.01" name="rate" value="${esc(l.rate ?? '')}" required></label>
        <label class="f">Extras do broker $<input type="number" inputmode="decimal" step="0.01" name="broker_extra" value="${esc(l.broker_extra ?? 0)}"></label>
        <label class="f">% dispatch<input type="number" inputmode="decimal" step="0.5" name="dispatch_pct" id="lfP" value="${esc(l.dispatch_pct ?? '')}"></label>
        <label class="f">% factoring<input type="number" inputmode="decimal" step="0.5" name="factoring_pct" value="${esc(l.factoring_pct ?? 0)}"></label>
        <label class="f">Broker<input name="broker" value="${esc(l.broker)}"></label>
        <label class="f">Equipamento<input name="equipment" value="${esc(l.equipment)}" placeholder="Cargo van, 26 ft…"></label>
        <label class="f">Peso<input name="weight" value="${esc(l.weight)}"></label>
        <label class="f full">Observações para o motorista<textarea name="notes">${esc(l.notes)}</textarea></label>
      </div><div class="calc" id="lfCalc"></div>
      <button class="btn gold wide" id="lfSave">Salvar</button>
      ${!isNew ? '<button type="button" class="btn bad wide" id="lfDel">Apagar carga</button>' : ''}</form>`, api => {
      const f = $('#lf', api.el), dSel = $('#lfD', f), pIn = $('#lfP', f);
      const syncDrv = () => { const d = drv(dSel.value); if (isNew || pIn.value === '') pIn.value = d.dispatch_pct ?? 10; };
      dSel.onchange = () => { syncDrv(); calc() }; if (pIn.value === '') syncDrv();
      const calc = () => { const o = H.form(f), rate = num(o.rate), ex = num(o.broker_extra), pct = num(o.dispatch_pct), mi = num(o.miles), dh = num(o.deadhead);
        const pay = Math.round(Math.max(rate - ex, 0) * (1 - pct / 100) * 100) / 100, fac = rate * num(o.factoring_pct) / 100, min = num(drv(o.driver_id).min_rpm);
        const rpm = mi ? rate / mi : 0;
        $('#lfCalc', f).innerHTML = `<span>Motorista recebe</span><span class="m">${fmt(pay)}</span><span>Você (dispatch + extras)</span><span class="m">${fmt(rate - pay)}</span>${fac ? `<span>Factoring</span><span class="m">−${fmt(fac)}</span>` : ''}
          <span>$/milha carregado</span><span class="m ${min && mi ? (rpm >= min ? 'ok' : 'low') : ''}">${mi ? fmt(rpm) : '—'}${min && mi && rpm < min ? ' (abaixo do mínimo)' : ''}</span><span>$/milha com vazio</span><span class="m">${mi + dh ? fmt(rate / (mi + dh)) : '—'}</span>` };
      f.oninput = calc; calc();
      f.onsubmit = async e => { e.preventDefault(); const o = H.form(f); o.company_id = o.company_id || drv(o.driver_id).company_id || null;
        if (l.stage === 'oferta' && o.stage === 'oferta' && !isNew && (num(o.rate) !== num(l.rate) || num(o.dispatch_pct) !== num(l.dispatch_pct))) { o.offer_response = null; o.counter_amount = null }
        await H.busy($('#lfSave', f), async () => { if (isNew) await H.q(H.sb.from('loads').insert(o)); else await H.q(H.sb.from('loads').update(o).eq('id', l.id)); api.close(); H.toast(o.stage === 'oferta' ? 'Oferta enviada para o app do motorista' : 'Carga salva'); A.reload(['loads']) }) };
      if ($('#lfDel', f)) H.confirmBtn($('#lfDel', f), 'Toque de novo para apagar', async () => { await H.q(H.sb.from('loads').delete().eq('id', l.id)); api.close(); H.toast('Carga apagada'); A.reload(['loads']) });
    });
  }

  /* ================= MOTORISTAS ================= */
  const vMotoristas = {
    html() {
      const id = location.hash.split('/')[1];
      if (id && drv(id).id) { setTimeout(() => driverSheet(drv(id)), 0); history.replaceState(null, '', '#motoristas') }
      return `<div class="stack"><div class="row between"><h1>Motoristas</h1><button class="btn gold" id="newDrv">+ Motorista</button></div>
      ${D.drivers.length ? D.drivers.map(d => { const rows = D.docs.filter(x => x.driver_id === d.id); let bad = 0, warn = 0, miss = 0, rev = 0;
        H.DOCS.forEach(it => { if (!H.docApplies(d, it)) return; const s = H.docStatus(d, it, rows).s; if (s === 'bad') bad++; else if (s === 'warn') warn++; else if (s === 'miss') miss++; else if (s === 'review') rev++ });
        const v = d.vehicle || {};

      <button class="btn gold wide" id="evGo">${esc(t().save)}</button></form>`, api => {
      const f = $('#ev', api.el);
      $('#evF', f).onchange = async e => { const files = [...e.target.files]; e.target.value = ''; for (const file of files) { try { H.toast('…'); const r = await H.upload('files', `${S.me.id}/loads/${l.id}`, file); photos.push(r.path); await H.thumbs($('#evT', f), photos) } catch (x) { H.fail(x) } } };
      f.onsubmit = async e => { e.preventDefault(); const o = H.form(f);
        if (!photos.length) { H.toast(t().needPhoto, true); return } if (kind === 'delivery' && !o.receiver_name) { H.toast(t().needName, true); return }
        await H.busy($('#evGo', f), async () => {
          await H.q(H.sb.from('load_events').insert({ load_id: l.id, driver_id: S.me.id, kind, photos, receiver_name: o.receiver_name || null, note: o.note }));
          await H.q(H.sb.rpc('driver_set_stage', { p_load: l.id, p_stage: kind === 'pickup' ? 'coletada' : 'entregue' }));
          api.close(); H.toast('✓'); await R.reload() }) };
    });
  }
  /* ---------------- pagamentos e Quick Pay ---------------- */
  const inQP = () => new Set(S.quickpay.filter(q => ['pendente', 'aprovado'].includes(q.status)).flatMap(q => q.load_ids));
  VIEWS.pagamentos = {
    html() {
      const qp = inQP(), un = S.loads.filter(l => l.stage === 'entregue' && !l.paid), fuelDed = S.fuel.filter(x => x.payer === 'cartao' && !x.settled).reduce((a, x) => a + num(x.total), 0);
      const owed = un.reduce((a, l) => a + num(l.driver_pay), 0), elig = un.filter(l => !l.settlement_id && !qp.has(l.id));
      return `<div class="stack"><div class="hero"><span class="muted">${esc(t().toReceive)}</span><div class="big">${fmt(owed - fuelDed)}</div>
        <div class="calc"><span>${un.length} ${esc(t().loadsN)}</span><span class="m">${fmt(owed)}</span><span>${esc(t().fuelDed)}</span><span class="m">−${fmt(fuelDed)}</span></div></div>
        <h2>${esc(t().qp)}</h2><p class="note">${esc(t().qpRule.replace('{p}', H.cfg.quickPayPct))}</p>
        ${elig.length ? `<button class="btn gold wide" id="qpBtn" ${H.quickPayOpen() ? '' : 'disabled'}>${esc(t().qpAsk)}</button>${H.quickPayOpen() ? '' : `<p class="note">${esc(t().qpClosed)}</p>`}` : ''}
        ${S.quickpay.map(q => `<div class="card"><div class="top2"><div><b>${fmt(q.net)}</b><div class="muted">${new Date(q.requested_at).toLocaleDateString()} · ${q.load_ids.length} ${esc(t().loadsN)} · ${esc(t().qpFee)} ${fmt(q.fee)}</div></div><span class="pill ${q.status === 'pago' ? 'p-good' : q.status === 'negado' ? 'p-bad' : 'p-warn'}">${esc(t().qpSt[q.status])}${q.status === 'aprovado' && q.eligible_on ? ' ' + brDate(q.eligible_on) : q.status === 'pago' ? ' ' + brDate(q.paid_at) : ''}</span></div></div>`).join('')}
        <h2>${esc(t().statements)}</h2>
        ${S.settlements.length ? S.settlements.map(s => { const L = S.loads.filter(l => l.settlement_id === s.id), F = S.fuel.filter(x => x.settlement_id === s.id);
          return `<div class="card sev ${s.status === 'pago' ? 'good' : 'warn'}"><div class="top2"><div><b>${brDate(s.period_start)} – ${brDate(s.period_end)}</b><div class="muted">${s.status === 'pago' ? esc(t().paidOn) + ' ' + brDate(s.paid_at) + (s.method ? ' · ' + esc(s.method) : '') : esc(t().approved)}</div></div><div class="money" style="color:var(--gold2)">${fmt(s.net)}<div class="muted">${esc(t().net)}</div></div></div>
          <div class="muted">${L.map(l => `${brDate(l.load_date)} ${route(l)} · ${fmt(l.driver_pay)}`).join('<br>')}${F.length ? '<br>' + F.map(x => `${brDate(x.fuel_date)} ${esc(t().fuel)} −${fmt(x.total)}`).join('<br>') : ''}${num(s.other_deductions) ? `<br>− ${fmt(s.other_deductions)} ${esc(s.other_note || '')}` : ''}</div></div>` }).join('') : `<div class="empty">${esc(t().noPay)}</div>`}</div>`;
    },
    wire(v) { const b = $('#qpBtn', v); if (b) b.onclick = qpSheet }
  };
  function qpSheet() {
    const qp = inQP(), L = S.loads.filter(l => l.stage === 'entregue' && !l.paid && !l.settlement_id && !qp.has(l.id)), pct = num(H.cfg.quickPayPct);
    H.sheet(`<form id="qf" class="stack"><div class="row between"><h2>${esc(t().qp)}</h2><button type="button" class="btn sm" data-close>✕</button></div><p class="note">${esc(t().qpPick)}</p>
      ${L.map(l => `<label class="chk card"><input type="checkbox" value="${l.id}" checked><span style="flex:1">${route(l)}<br><span class="muted">${brDate(l.load_date)}</span></span><span class="money">${fmt(l.driver_pay)}</span></label>`).join('')}
      <div class="calc" id="qfC"></div><button class="btn gold wide" id="qfGo">${esc(t().qpSend)}</button></form>`, api => {
      const f = $('#qf', api.el), sel = () => $$('input[type=checkbox]', f).filter(i => i.checked).map(i => i.value);
      const calc = () => { const a = L.filter(l => sel().includes(l.id)).reduce((s, l) => s + num(l.driver_pay), 0), fee = Math.round(a * pct) / 100; $('#qfC', f).innerHTML = `<span>${esc(t().youGet)}</span><span class="m">${fmt(a)}</span><span>${esc(t().qpFee)} ${pct}%</span><span class="m">−${fmt(fee)}</span><span><b>${esc(t().qpNet)}</b></span><span class="m"><b>${fmt(a - fee)}</b></span>` };
      f.onchange = calc; calc();
      f.onsubmit = async e => { e.preventDefault(); const ids = sel(); if (!ids.length) return; await H.busy($('#qfGo', f), async () => { await H.q(H.sb.rpc('request_quickpay', { p_loads: ids })); api.close(); H.toast(t().qpSent); await R.reload() }) };
    });
  }
  /* ---------------- documentos ---------------- */
  VIEWS.documentos = {
    html() {
      const items = H.DOCS.filter(it => it.drv && H.docApplies(S.me, it));
      return `<div class="stack"><p class="note">${esc(t().docsHelp)}</p>${items.map(it => { const s = H.docStatus(S.me, it, S.docs), last = s.last;
        const label = s.s === 'ok' || s.s === 'warn' ? (s.due ? t().docSt[s.s] + ' · ' + brDate(s.due) : t().docSt.ok) : t().docSt[s.s];
        return `<div class="card sev ${s.s === 'ok' ? 'good' : s.s === 'review' ? 'gold' : s.s === 'opt' ? '' : s.s === 'warn' ? 'warn' : 'bad'}" data-doc="${it.k}"><div class="top2"><b>${esc(docTitle(it))}</b><span class="pill ${H.pillCls[s.s]}">${esc(label)}</span></div>
          ${last && last.status === 'rejeitado' && last.note ? `<span class="err">${esc(last.note)}</span>` : ''}
          ${s.s !== 'review' ? `<span class="btn upl">${esc(last ? t().reupload : t().upload)}<input type="file" accept="image/*,application/pdf"></span>` : ''}</div>` }).join('')}</div>`;
    },
    wire(v) { $$('[data-doc]', v).forEach(el => { const inp = $('input[type=file]', el); if (!inp) return; inp.onchange = async e => { const file = e.target.files[0]; e.target.value = ''; if (!file) return;
      try { H.toast('…'); const r = await H.upload('files', `${S.me.id}/docs/${el.dataset.doc}`, file); await H.q(H.sb.from('driver_docs').insert({ driver_id: S.me.id, item: el.dataset.doc, status: 'enviado', file_path: r.path, file_name: r.name })); H.toast(t().sent); await R.reload() } catch (x) { H.fail(x) } } }) }
  };
  /* ---------------- combustível ---------------- */
  VIEWS.combustivel = {
    html: () => `<div class="stack"><button class="btn gold wide" id="fAdd">${esc(t().fuelAdd)}</button>
      ${S.fuel.length ? S.fuel.map(x => `<div class="card"><div class="top2"><div><b>${brDate(x.fuel_date)}</b><div class="muted">${esc(x.station || '')}${x.gallons ? ' · ' + num(x.gallons).toFixed(1) + ' gal' : ''}${x.odometer ? ' · ' + fmtI(x.odometer) : ''}</div></div><div class="money">${fmt(x.total)}<div class="muted">${x.payer === 'cartao' ? esc(t().card) + (x.settled ? ' ✓' : '') : esc(t().mine)}</div></div></div></div>`).join('') : ''}</div>`,
    wire(v) { $('#fAdd', v).onclick = fuelSheet }
  };
  function fuelSheet() {
    const photos = [];
    H.sheet(`<form id="fs" class="stack"><div class="row between"><h2>${esc(t().fuel)}</h2><button type="button" class="btn sm" data-close>✕</button></div><p class="note">${esc(t().fuelHelp)}</p>
      <div class="thumbs" id="fsT"></div><span class="btn upl wide">${esc(t().photos)}<input type="file" id="fsF" accept="image/*" multiple></span>
      <div class="g2"><label class="f">${esc(t().date)}<input type="date" name="fuel_date" value="${iso(today())}" required></label><label class="f">${esc(t().total)}<input type="number" inputmode="decimal" step="0.01" name="total" required></label>
      <label class="f">${esc(t().gallons)}<input type="number" inputmode="decimal" step="0.001" name="gallons"></label><label class="f">${esc(t().odometer)}<input type="number" inputmode="numeric" name="odometer"></label>
      <label class="f full">${esc(t().station)}<input name="station"></label><label class="f full">${esc(t().payer)}<select name="payer"><option value="cartao">${esc(t().card)}</option><option value="motorista">${esc(t().mine)}</option></select></label></div>
      <button class="btn gold wide" id="fsGo">${esc(t().save)}</button></form>`, api => {
      const f = $('#fs', api.el);
      $('#fsF', f).onchange = async e => { const files = [...e.target.files]; e.target.value = ''; for (const file of files) { try { H.toast('…'); photos.push((await H.upload('files', `${S.me.id}/fuel`, file)).path); await H.thumbs($('#fsT', f), photos) } catch (x) { H.fail(x) } } };
      f.onsubmit = async e => { e.preventDefault(); const o = H.form(f); if (!photos.length) { H.toast(t().needPhoto, true); return }
        await H.busy($('#fsGo', f), async () => { await H.q(H.sb.from('fuel').insert({ ...o, driver_id: S.me.id, photos })); api.close(); H.toast('✓'); await R.reload() }) };
    });
  }
})(window.HTS);

</script>
<script>
  
  HTS.boot();
</script>
</body>
</html>
