<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vagas para motoristas OTR · Helen Transport Services</title>
<meta name="description" content="Box truck 14 ft e cargo van · viagens interestaduais (OTR) · cadastro online em português, inglês e espanhol.">
<meta property="og:title" content="Vagas para motoristas OTR · Helen Transport Services">
<meta property="og:description" content="Box truck 14 ft (vaga imediata) e cargo van (cadastro). PT · EN · ES">
<meta property="og:image" content="https://helentransportservices.github.io/vaga-boxtruck.jpg">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0b0b0d;--panel:#16161a;--panel2:#1d1d23;--ink:#f3efe6;--muted:#a9a397;--gold:#d4a537;--gold2:#f0cf7a;--good:#4cc283;--line:#2c2c33;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:680px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 70px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.brand{font-weight:800;letter-spacing:.1em;color:var(--gold);font-size:13px;line-height:1.25}
.langs{display:flex;gap:6px;flex:none}
.langs button{font:700 14px system-ui;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--gold);color:#1a1305;border-color:var(--gold)}
h1{margin:4px 0 0;font-size:32px;line-height:1.1;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold2)}
h2{margin:8px 0 0;font-size:21px}
.sub{color:var(--muted);margin:0}
.job{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.job img{display:block;width:100%;height:210px;object-fit:cover}
.job .b{padding:16px;display:flex;flex-direction:column;gap:8px}
.tag{align-self:flex-start;font:800 13px system-ui;letter-spacing:.04em;padding:5px 11px;border-radius:999px}
.tag.on{background:var(--good);color:#04210f}.tag.soon{background:var(--gold);color:#1a1305}
.job h3{margin:0;font-size:22px}
.money{font-size:24px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:15px;margin:0}
ul.ck{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.ck li{padding-left:28px;position:relative}
ul.ck li::before{content:"✓";position:absolute;left:4px;color:var(--good);font-weight:900}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px}
summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:var(--gold2);font-weight:900}
details[open] summary::after{content:"–"}
details p{margin:0;padding:0 16px 16px;color:#dcd5c8}
a.btn{display:block;text-align:center;text-decoration:none;font:800 17px system-ui;border-radius:14px;padding:15px;border:1px solid var(--line);background:#222228;color:var(--ink)}
a.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1305;border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:460px){.two{grid-template-columns:1fr}}
.fine{color:var(--muted);font-size:13px;text-align:center;margin:6px 0 0}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
</style>
</head>
<body>
<main class="w">
  <div class="top"><span class="brand">HELEN TRANSPORT<br>SERVICES</span>
    <div class="langs" role="group" aria-label="Idioma / Language">
      <button data-l="pt">🇧🇷 PT</button><button data-l="en">🇺🇸 EN</button><button data-l="es">🇪🇸 ES</button>
    </div></div>

  <h1 data-t="h"></h1>
  <p class="sub" data-t="sub"></p>

  <section class="job">
    <img src="vaga-boxtruck.jpg" alt="Box truck 14 ft">
    <div class="b"><span class="tag on" data-t="j1tag"></span><h3>Box truck 14 ft · RAM ProMaster 3500</h3>
      <div class="money">US$ 700 – 1,200 <span data-t="wk"></span></div>
      <p class="muted" data-t="j1pay"></p>
      <a class="btn gold" id="ap1" href="#" data-t="ap1"></a></div>
  </section>

  <section class="job">
    <img src="vaga-van.jpg" alt="Cargo van">
    <div class="b"><span class="tag soon" data-t="j2tag"></span><h3>Cargo van · RAM ProMaster 3500</h3>
      <div class="money">US$ 700 – 1,000 <span data-t="wk"></span></div>
      <p class="muted" data-t="j2pay"></p>
      <a class="btn" id="ap2" href="#" data-t="ap2"></a></div>
  </section>

  <section class="card"><h2 data-t="reqT"></h2><ul class="ck" id="req"></ul></section>
  <section class="card"><h2 data-t="offT"></h2><ul class="ck" id="off"></ul><p class="muted" data-t="offNote"></p></section>

  <h2 data-t="faqT"></h2>
  <div id="faq" style="display:flex;flex-direction:column;gap:8px"></div>

  <section class="card"><h2 data-t="howT"></h2><p class="muted" data-t="how"></p>
    <a class="btn gold" id="ap3" href="#" data-t="ap1"></a>
    <a class="btn" id="vid" href="ajuda.html" data-t="vid"></a>
    <a class="btn" href="https://wa.me/14073760990" target="_blank" rel="noopener" data-t="wa"></a></section>

  <p class="fine" data-t="fine"></p>
</main>
<script>
const T={
pt:{h:'Vagas para motoristas <em>OTR</em>',sub:'Viagens interestaduais pelos Estados Unidos. Leia tudo abaixo: as respostas para as dúvidas mais comuns estão aqui.',
 j1tag:'VAGA DISPONÍVEL AGORA',j2tag:'CADASTRO PARA PRÓXIMAS VAGAS',wk:'/semana',
 j1pay:'30% do valor bruto de cada frete. Ganho estimado, não garantido: depende das cargas da semana.',
 j2pay:'30% do valor bruto de cada frete. Ganho estimado, não garantido. Cadastre-se agora para ser chamado quando a vaga abrir.',
 ap1:'Quero a vaga do box truck',ap2:'Cadastro para a cargo van',
 reqT:'Requisitos',req:['Carteira de motorista válida (não precisa de CDL)','Autorização para trabalhar nos EUA','21 anos ou mais','Bom histórico de direção (passa pela análise do seguro)','Inglês para falar com broker e cliente','Disponibilidade para viagens de 20 a 30 dias','Cuidado com o veículo, limpeza e organização'],
 offT:'O que a empresa oferece',off:['Combustível e manutenção por conta da empresa','Pagamento toda sexta-feira','Veículo equipado para dormir: colchão, geladeira, cafeteira, air fryer e aquecedor','App próprio: ofertas de carga, fotos, combustível e pagamentos no celular','Suporte da dispatcher durante as viagens'],
 offNote:'Alimentação e despesas pessoais por conta do motorista.',
 faqT:'Perguntas frequentes',
 faq:[['Precisa de CDL?','Não. Os dois veículos são leves (abaixo de 10.001 lbs), então basta a carteira de motorista comum e válida.'],
  ['Como funciona o pagamento?','Você trabalha como autônomo (1099) e recebe 30% do valor bruto de cada frete (no box truck e na cargo van). O pagamento é toda sexta-feira, pelas cargas que o broker já pagou. O primeiro pagamento sai cerca de 15 dias depois de começar. Não há salário mínimo garantido.'],
  ['Quanto vou ganhar por semana?','A estimativa é de US$ 700 a 1.200 no box truck e de US$ 700 a 1.000 na cargo van. Depende das cargas e das rotas de cada semana. Não é um valor garantido.'],
  ['Onde eu durmo na estrada?','No próprio veículo, que tem colchão, geladeira, cafeteira, air fryer e aquecedor a diesel. Se preferir hotel em algum dia, fica por sua conta. Dica: o plano Black Card da Planet Fitness dá banho em qualquer unidade do país.'],
  ['Quantas horas por dia vou dirigir?','Depende da carga. Em cargas diretas pode chegar a 10–12 horas em um dia. Você organiza as suas paradas e o seu descanso: segurança em primeiro lugar.'],
  ['Quanto tempo fico fora de casa?','As viagens são de 20 a 30 dias direto na estrada. Depois de 30 dias trabalhados, você tem 1 semana de folga (sem remuneração), que pode ser na sua cidade de origem.'],
  ['Quem paga combustível e manutenção?','A empresa. Se você pagar combustível do seu bolso, o valor volta como reembolso no pagamento de sexta.'],
  ['E as multas?','Multas de trânsito, estacionamento, pedágio e radar causadas pelo motorista são de responsabilidade dele. Isso está no contrato.'],
  ['Preciso ter experiência?','Experiência ajuda, mas o mais importante é responsabilidade, bom histórico de direção e disponibilidade. A empresa explica o funcionamento do app e do veículo antes da primeira viagem.'],
  ['Onde eu pego o veículo?','O local de retirada e devolução é combinado individualmente.'],
  ['Como é a seleção?','1) Você faz o cadastro online. 2) A empresa analisa e verifica seu histórico com o seguro. 3) Você envia os documentos e assina o contrato pelo app. 4) Conhece o veículo e começa.']],
 howT:'Como me candidatar?',how:'Faça o cadastro online (leva poucos minutos). Antes, se quiser, assista aos vídeos que mostram como funcionam o cadastro e o app.',
 vid:'▶ Ver vídeos de como funciona',wa:'Ainda com dúvida? WhatsApp (407) 376-0990',
 fine:'Valores semanais estimados, não garantidos. Sujeitos à disponibilidade de cargas, ao faturamento dos fretes e à aprovação do seguro.'},
en:{h:'OTR driver <em>jobs</em>',sub:'Interstate trips across the USA. Read everything below: the answers to the most common questions are here.',
 j1tag:'OPEN NOW',j2tag:'SIGN UP FOR UPCOMING JOBS',wk:'/week',
 j1pay:'30% of the gross freight of every load. Estimated earnings, not guaranteed: it depends on the week’s loads.',
 j2pay:'30% of the gross freight of every load. Estimated earnings, not guaranteed. Sign up now to be called when the job opens.',
 ap1:'Apply for the box truck job',ap2:'Sign up for the cargo van',
 reqT:'Requirements',req:['Valid driver’s license (no CDL needed)','US work authorization','21 or older','Good driving record (reviewed by the insurance)','English to talk with brokers and customers','Available for 20–30 day trips','Care for the vehicle, cleaning and organization'],
 offT:'What we offer',off:['Fuel and maintenance paid by the company','Paid every Friday','Vehicle set up for sleeping: mattress, fridge, coffee maker, air fryer and heater','Our own app: load offers, photos, fuel and pay on your phone','Dispatcher support during trips'],
 offNote:'Food and personal expenses are paid by the driver.',
 faqT:'Frequently asked questions',
 faq:[['Do I need a CDL?','No. Both vehicles are light (under 10,001 lbs), so a regular valid driver’s license is enough.'],
  ['How does pay work?','You work as an independent contractor (1099) and get 30% of the gross freight of each load (box truck and cargo van). Pay is every Friday for loads the broker has already paid. The first payment comes about 15 days after you start. There is no guaranteed minimum.'],
  ['How much will I make per week?','Estimated US$700–1,200 on the box truck and US$700–1,000 on the cargo van. It depends on each week’s loads and routes. Not guaranteed.'],
  ['Where do I sleep on the road?','In the vehicle itself, which has a mattress, fridge, coffee maker, air fryer and a diesel heater. If you prefer a hotel some night, that is on you. Tip: a Planet Fitness Black Card gives you showers at any location in the country.'],
  ['How many hours a day will I drive?','It depends on the load. Direct loads can take 10–12 hours in a day. You plan your own stops and rest: safety first.'],
  ['How long will I be away from home?','You stay 20 to 30 days in a row on the road. After 30 days worked you get 1 week off (unpaid), which can be in your hometown.'],
  ['Who pays for fuel and maintenance?','The company. If you pay for fuel yourself, you get it back as a reimbursement in Friday’s pay.'],
  ['What about tickets?','Traffic, parking, toll and camera tickets caused by the driver are the driver’s responsibility. This is in the agreement.'],
  ['Do I need experience?','Experience helps, but what matters most is responsibility, a good driving record and availability. We show you how the app and the vehicle work before your first trip.'],
  ['Where do I pick up the vehicle?','Pickup and return locations are arranged individually.'],
  ['How does hiring work?','1) Apply online. 2) We review your application and check your record with the insurance. 3) You send your documents and sign the agreement in the app. 4) You get to know the vehicle and start.']],
 howT:'How do I apply?',how:'Fill out the online application (takes a few minutes). If you like, first watch the videos showing how sign-up and the app work.',
 vid:'▶ Watch how it works',wa:'Still have questions? WhatsApp (407) 376-0990',
 fine:'Estimated weekly amounts, not guaranteed. Subject to load availability, freight billing and insurance approval.'},
es:{h:'Trabajo para choferes <em>OTR</em>',sub:'Viajes interestatales por Estados Unidos. Lee todo abajo: aquí están las respuestas a las preguntas más comunes.',
 j1tag:'DISPONIBLE AHORA',j2tag:'REGISTRO PARA PRÓXIMAS VACANTES',wk:'/semana',
 j1pay:'30% del valor bruto de cada flete. Ganancia estimada, no garantizada: depende de las cargas de la semana.',
 j2pay:'30% del valor bruto de cada flete. Ganancia estimada, no garantizada. Regístrate ahora para que te llamemos cuando abra la vacante.',
 ap1:'Quiero el puesto del box truck',ap2:'Registro para la cargo van',
 reqT:'Requisitos',req:['Licencia de conducir válida (no necesita CDL)','Autorización para trabajar en EE. UU.','21 años o más','Buen historial de manejo (revisado por el seguro)','Inglés para hablar con broker y cliente','Disponibilidad para viajes de 20 a 30 días','Cuidado del vehículo, limpieza y organización'],
 offT:'Lo que ofrecemos',off:['Combustible y mantenimiento por cuenta de la empresa','Pago cada viernes','Vehículo equipado para dormir: colchón, refrigerador, cafetera, air fryer y calefactor','App propia: ofertas de carga, fotos, combustible y pagos en tu celular','Apoyo de la dispatcher durante los viajes'],
 offNote:'Comida y gastos personales por cuenta del chofer.',
 faqT:'Preguntas frecuentes',
 faq:[['¿Necesito CDL?','No. Los dos vehículos son livianos (menos de 10,001 lbs), así que basta con una licencia de conducir común y válida.'],
  ['¿Cómo es el pago?','Trabajas como contratista independiente (1099) y recibes el 30% del valor bruto de cada flete (box truck y cargo van). El pago es cada viernes, por las cargas que el broker ya pagó. El primer pago llega unos 15 días después de empezar. No hay salario mínimo garantizado.'],
  ['¿Cuánto voy a ganar por semana?','Se estima entre US$700 y 1,200 en el box truck y entre US$700 y 1,000 en la cargo van. Depende de las cargas y rutas de cada semana. No está garantizado.'],
  ['¿Dónde duermo en la carretera?','En el mismo vehículo, que tiene colchón, refrigerador, cafetera, air fryer y calefactor a diésel. Si prefieres hotel algún día, corre por tu cuenta. Consejo: el plan Black Card de Planet Fitness te da duchas en cualquier sucursal del país.'],
  ['¿Cuántas horas al día voy a manejar?','Depende de la carga. En cargas directas pueden ser 10–12 horas en un día. Tú organizas tus paradas y tu descanso: la seguridad primero.'],
  ['¿Cuánto tiempo estaré fuera de casa?','Estás de 20 a 30 días seguidos en la carretera. Después de 30 días trabajados tienes 1 semana de descanso (sin pago), que puede ser en tu ciudad de origen.'],
  ['¿Quién paga combustible y mantenimiento?','La empresa. Si pagas combustible de tu bolsillo, se te devuelve como reembolso en el pago del viernes.'],
  ['¿Y las multas?','Las multas de tránsito, estacionamiento, peaje y cámara causadas por el chofer son su responsabilidad. Así está en el contrato.'],
  ['¿Necesito experiencia?','La experiencia ayuda, pero lo más importante es la responsabilidad, un buen historial de manejo y la disponibilidad. Te explicamos cómo funcionan la app y el vehículo antes del primer viaje.'],
  ['¿Dónde recojo el vehículo?','El lugar de recogida y devolución se acuerda de forma individual.'],
  ['¿Cómo es la selección?','1) Te registras en línea. 2) Revisamos tu solicitud y tu historial con el seguro. 3) Envías tus documentos y firmas el contrato en la app. 4) Conoces el vehículo y empiezas.']],
 howT:'¿Cómo me postulo?',how:'Llena el registro en línea (toma pocos minutos). Si quieres, mira antes los videos que muestran cómo funcionan el registro y la app.',
 vid:'▶ Ver videos de cómo funciona',wa:'¿Aún tienes dudas? WhatsApp (407) 376-0990',
 fine:'Montos semanales estimados, no garantizados. Sujetos a la disponibilidad de cargas, la facturación de los fletes y la aprobación del seguro.'}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function pick(){let l=new URLSearchParams(location.search).get('l');if(T[l])return l;try{l=localStorage.getItem('hts-lang');if(T[l])return l}catch(e){}l=(navigator.language||'pt').slice(0,2);return T[l]?l:'pt'}
function set(l){const t=T[l];document.documentElement.lang=l;
 document.querySelectorAll('[data-t]').forEach(el=>{const v=t[el.dataset.t];if(v==null)return;if(el.dataset.t==='h')el.innerHTML=v;else el.textContent=v});
 document.getElementById('req').innerHTML=t.req.map(x=>`<li>${esc(x)}</li>`).join('');
 document.getElementById('off').innerHTML=t.off.map(x=>`<li>${esc(x)}</li>`).join('');
 document.getElementById('faq').innerHTML=t.faq.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
 const sfx=l==='pt'?'':'&l='+l;
 ap1.href=ap3.href=`cadastro.html?tipo=motorista${sfx}`;ap2.href=`cadastro.html?tipo=van${sfx}`;vid.href=`ajuda.html?l=${l}`;
 document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
 try{localStorage.setItem('hts-lang',l)}catch(e){}}
const ap1=document.getElementById('ap1'),ap2=document.getElementById('ap2'),ap3=document.getElementById('ap3'),vid=document.getElementById('vid');
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>set(b.dataset.l));
set(pick());
</script>
</body>
</html>
